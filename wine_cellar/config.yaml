name: Wine Cellar
version: "0.12.1"
slug: wine_cellar
description: Your wine cellar in Home Assistant. Bottles, barcode scanning and labels, pictures, food pairing, cellar climate, wine list, stats and export. Works out of the box, no database to set up.
url: https://github.com/niklasschwarz-sketch/ha-wine-cellar
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
backup: cold
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:glass-wine
panel_title: Cellar
options:
  auto_images: true
  systembolaget_prices: false
  eur_sek_rate: 11.0
schema:
  auto_images: bool?
  systembolaget_prices: bool?
  eur_sek_rate: float?
